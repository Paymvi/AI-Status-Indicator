<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Claude Workers</title>
<link rel="stylesheet" href="phone.css">
<script src="phone.js" defer></script>
</head>
<body>
<main id="board" class="board stale" data-top="">
  <header class="head">
    <div class="titlebar">
      <h1>CLAUDE WORKERS</h1>
      <span id="conn" class="conn" data-conn="connecting" role="status">CONNECTING…</span>
    </div>
    <div id="summary" class="summary" hidden></div>
    <div class="viewbar">
      <div class="segs" role="group" aria-label="View">
        <button type="button" id="view-list" class="seg" data-view="list" aria-pressed="true">List</button>
        <button type="button" id="view-creatures" class="seg" data-view="creatures" aria-pressed="false">Creatures</button>
      </div>
      <button type="button" id="gear" class="gear" aria-label="Display settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M19 9.5L21.8 10L21.8 14L19 14.5L18.7 15.2L20.3 17.5L17.5 20.3L15.2 18.7L14.5 19L14 21.8L10 21.8L9.5 19L8.8 18.7L6.5 20.3L3.7 17.5L5.3 15.2L5 14.5L2.2 14L2.2 10L5 9.5L5.3 8.8L3.7 6.5L6.5 3.7L8.8 5.3L9.5 5L10 2.2L14 2.2L14.5 5L15.2 5.3L17.5 3.7L20.3 6.5L18.7 8.8ZM12 15.3a3.3 3.3 0 1 1 0-6.6a3.3 3.3 0 1 1 0 6.6Z"/></svg>
      </button>
    </div>
    <div id="settings" class="settings" role="group" aria-label="Display settings" hidden>
      <button type="button" id="usage-toggle" class="tog" aria-pressed="true">Show usage</button>
      <div id="petbar" class="petbar" role="group" aria-label="Creatures options" hidden>
        <button type="button" id="compact-toggle" class="tog" aria-pressed="false">Compact</button>
        <button type="button" id="context-toggle" class="tog" aria-pressed="false">Show context</button>
      </div>
    </div>
  </header>
  <section id="usage" class="usage" aria-label="Claude usage (account-wide)">
    <button type="button" id="usage-sum" class="usage-sum" aria-expanded="false" aria-controls="usage-detail">
      <span class="usage-title">USAGE</span>
      <span id="usage-mini" class="usage-mini"><span class="muted">Loading…</span></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div id="usage-detail" class="usage-detail" hidden>
      <p class="usage-scope">Account-wide · shared by all your Claude workers and devices</p>
      <p id="usage-state" class="usage-state"></p>
      <p id="usage-msg" class="usage-msg" hidden></p>
      <ul id="usage-limits" class="usage-limits"></ul>
      <ul id="usage-notes" class="usage-notes"></ul>
      <p id="usage-src" class="usage-src"></p>
      <button type="button" id="usage-refresh" class="usage-btn">Refresh</button>
    </div>
  </section>
  <section id="notify" class="usage notify" aria-label="Notifications on this phone">
    <button type="button" id="notify-sum" class="usage-sum" aria-expanded="false" aria-controls="notify-detail">
      <span class="usage-title">NOTIFICATIONS</span>
      <span id="notify-mini" class="usage-mini"><span class="muted">Checking…</span></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div id="notify-detail" class="usage-detail" hidden>
      <p class="usage-scope">This phone · NEEDS YOU and DONE, even with this page closed</p>
      <p id="notify-state" class="usage-state"></p>
      <p id="notify-msg" class="usage-msg" hidden></p>
      <div id="notify-prefs" class="notify-row" hidden>
        <button type="button" id="notify-needs" class="tog" aria-pressed="true">NEEDS YOU</button>
        <button type="button" id="notify-done" class="tog" aria-pressed="true">DONE</button>
      </div>
      <div class="notify-row">
        <button type="button" id="notify-enable" class="usage-btn" hidden>Enable</button>
        <button type="button" id="notify-test" class="usage-btn" hidden>Send test</button>
        <button type="button" id="notify-off" class="usage-btn" hidden>Turn off</button>
      </div>
    </div>
  </section>
  <div id="banner" class="banner" hidden>
    <strong id="banner-title"></strong>
    <span id="banner-when"></span>
    <span id="banner-why" class="why"></span>
  </div>
  <ul id="rows" class="rows">
    <li class="row placeholder"><span class="ring"></span><span class="name muted">Connecting to the laptop…</span></li>
  </ul>
  <div id="creatures" class="creatures" hidden>
    <ul id="pets" class="pets"></ul>
    <p id="pet-hint" class="hint">Tap a creature to bring up its window on the laptop.</p>
  </div>
</main>
<div id="note" class="note" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">This page needs JavaScript to show your Claude workers.</p></noscript>
</body>
</html>
