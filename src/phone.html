<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Claude Workers</title>
<link rel="stylesheet" href="phone.css">
<script src="phone.js" defer></script>
</head>
<body>
<main id="board" class="board stale" data-top="">
  <header class="head">
    <div class="titlebar">
      <h1>CLAUDE WORKERS</h1>
      <span id="conn" class="conn" data-conn="connecting" role="status">CONNECTING…</span>
    </div>
    <div id="summary" class="summary" hidden></div>
    <div class="viewbar">
      <div class="segs" role="group" aria-label="View">
        <button type="button" id="view-list" class="seg" data-view="list" aria-pressed="true">List</button>
        <button type="button" id="view-creatures" class="seg" data-view="creatures" aria-pressed="false">Creatures</button>
      </div>
      <button type="button" id="usage-toggle" class="tog" aria-pressed="true">Show usage</button>
    </div>
    <div id="petbar" class="viewbar petbar" role="group" aria-label="Creatures options" hidden>
      <button type="button" id="compact-toggle" class="tog" aria-pressed="false">Compact</button>
      <button type="button" id="context-toggle" class="tog" aria-pressed="false">Show context</button>
    </div>
  </header>
  <section id="usage" class="usage" aria-label="Claude usage (account-wide)">
    <button type="button" id="usage-sum" class="usage-sum" aria-expanded="false" aria-controls="usage-detail">
      <span class="usage-title">USAGE</span>
      <span id="usage-mini" class="usage-mini"><span class="muted">Loading…</span></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div id="usage-detail" class="usage-detail" hidden>
      <p class="usage-scope">Account-wide · shared by all your Claude workers and devices</p>
      <p id="usage-state" class="usage-state"></p>
      <p id="usage-msg" class="usage-msg" hidden></p>
      <ul id="usage-limits" class="usage-limits"></ul>
      <ul id="usage-notes" class="usage-notes"></ul>
      <p id="usage-src" class="usage-src"></p>
      <button type="button" id="usage-refresh" class="usage-btn">Refresh</button>
    </div>
  </section>
  <div id="banner" class="banner" hidden>
    <strong id="banner-title"></strong>
    <span id="banner-when"></span>
    <span id="banner-why" class="why"></span>
  </div>
  <ul id="rows" class="rows">
    <li class="row placeholder"><span class="ring"></span><span class="name muted">Connecting to the laptop…</span></li>
  </ul>
  <div id="creatures" class="creatures" hidden>
    <ul id="pets" class="pets"></ul>
    <p id="pet-hint" class="hint">Tap a creature to bring up its window on the laptop.</p>
  </div>
</main>
<div id="note" class="note" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">This page needs JavaScript to show your Claude workers.</p></noscript>
</body>
</html>
